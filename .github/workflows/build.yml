name: Build Prelude Updater

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:20260219

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check dependencies
        run: |
          dkp-pacman -Q \
            switch-curl \
            switch-sdl2 \
            switch-sdl2_ttf \
            switch-sdl2_mixer \
            switch-freetype \
            switch-harfbuzz \
            switch-zlib

      - name: Verify staged self-update source
        run: |
          grep -q 'envSetNextLoad' source/updater.c
          grep -q 'SELF_STAGE_PATH' source/updater.c
          grep -q 'updater_finish_self_update' source/updater.c
          grep -q 'prelude-updater.stage.nro' source/updater.h

      - name: Build
        run: make -j$(nproc)

      - name: Verify NRO metadata
        run: |
          test -s prelude-updater.nacp
          test -s prelude-updater.nro
          grep -a -q "Prelude Updater" prelude-updater.nacp
          grep -a -q "RadiantDelux" prelude-updater.nacp
          grep -a -q "1.4.0" prelude-updater.nacp
          grep -a -q "Prelude Updater" prelude-updater.nro
          grep -a -q "RadiantDelux" prelude-updater.nro

      - name: Build SD package
        run: |
          rm -rf release-package
          mkdir -p release-package/switch/Prelude-Updater/music
          cp prelude-updater.nro release-package/switch/Prelude-Updater/prelude-updater.nro
          cp music/*.mp3 release-package/switch/Prelude-Updater/music/
          cd release-package
          zip -r ../Prelude-Updater-v1.4.0.zip switch
          cd ..
          test -s Prelude-Updater-v1.4.0.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prelude-updater-${{ github.run_number }}
          path: |
            prelude-updater.nro
            Prelude-Updater-v1.4.0.zip
          if-no-files-found: error

      - name: Publish v1.4.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: Prelude Updater v1.4.0
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            Prelude-Updater-v1.4.0.zip
            prelude-updater.nro
          make_latest: true

      - name: Upload packaged assets to tagged release
        if: startsWith(github.ref, 'refs/tags/v1.4.0')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Prelude-Updater-v1.4.0.zip
            prelude-updater.nro
          generate_release_notes: true
