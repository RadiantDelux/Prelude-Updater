name: Build Prelude Updater

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Switch dependencies
        run: |
          dkp-pacman -Syu --noconfirm \
            switch-curl \
            switch-sdl2 \
            switch-sdl2_ttf \
            switch-freetype \
            switch-harfbuzz \
            switch-zlib

      - name: Build
        run: make -j$(nproc)

      - name: Verify NRO metadata
        run: |
          test -s prelude-updater.nacp
          test -s prelude-updater.nro
          grep -a -q "Prelude Updater" prelude-updater.nacp
          grep -a -q "RadiantDelux" prelude-updater.nacp
          grep -a -q "1.2.0" prelude-updater.nacp
          grep -a -q "Prelude Updater" prelude-updater.nro
          grep -a -q "RadiantDelux" prelude-updater.nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: prelude-updater-${{ github.ref_name }}
          path: prelude-updater.nro
          if-no-files-found: error

      - name: Upload NRO to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: prelude-updater.nro
          generate_release_notes: true
