name: Build Prelude Updater

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:20260219

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check dependencies
        run: |
          dkp-pacman -Q \
            switch-curl \
            switch-sdl2 \
            switch-sdl2_ttf \
            switch-sdl2_mixer \
            switch-freetype \
            switch-harfbuzz \
            switch-zlib

      - name: Build
        run: make -j$(nproc)

      - name: Verify NRO metadata
        run: |
          test -s prelude-updater.nacp
          test -s prelude-updater.nro
          grep -a -q "Prelude Updater" prelude-updater.nacp
          grep -a -q "RadiantDelux" prelude-updater.nacp
          grep -a -q "1.3.0" prelude-updater.nacp
          grep -a -q "Prelude Updater" prelude-updater.nro
          grep -a -q "RadiantDelux" prelude-updater.nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: prelude-updater-${{ github.run_number }}
          path: prelude-updater.nro
          if-no-files-found: error

      - name: Publish release from release commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: Prelude Updater v1.3.0
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: prelude-updater.nro
          make_latest: true

      - name: Upload NRO to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: prelude-updater.nro
          generate_release_notes: true
